<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#27272a" stroke-width="4"/>

  <!-- Center Artwork: Video Reel & Convert Badge -->
  <g filter="url(#shadow)">
    <!-- Video Player Frame -->
    <rect x="100" y="116" width="312" height="220" rx="36" fill="#121215" stroke="#3f3f46" stroke-width="6"/>
    
    <!-- Film Strip Header Holes -->
    <circle cx="140" cy="144" r="8" fill="#52525b"/>
    <circle cx="180" cy="144" r="8" fill="#52525b"/>
    <circle cx="220" cy="144" r="8" fill="#52525b"/>
    <circle cx="260" cy="144" r="8" fill="#52525b"/>
    <circle cx="300" cy="144" r="8" fill="#52525b"/>
    <circle cx="340" cy="144" r="8" fill="#52525b"/>
    <circle cx="372" cy="144" r="8" fill="#52525b"/>

    <!-- Convert Arrow Play Symbol -->
    <path d="M 230 185 L 305 230 L 230 275 Z" fill="url(#emeraldGrad)"/>
    
    <!-- Conversion Orbit Arcs -->
    <path d="M 160 270 A 90 90 0 0 1 270 172" fill="none" stroke="url(#emeraldGrad)" stroke-width="10" stroke-linecap="round"/>
    <polygon points="274,162 290,174 274,186" fill="#34d399"/>

    <path d="M 352 210 A 90 90 0 0 1 242 308" fill="none" stroke="url(#emeraldGrad)" stroke-width="10" stroke-linecap="round"/>
    <polygon points="238,318 222,306 238,294" fill="#10b981"/>
  </g>

  <!-- Format Pill Tag: MKV -> MP4 -->
  <rect x="136" y="372" width="240" height="52" rx="26" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" stroke-width="3"/>
  <text x="256" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="1">MKV ➔ MP4</text>
</svg>
